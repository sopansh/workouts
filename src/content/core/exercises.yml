      head: [194, 98]
      shoulder: [172, 106]
      elbow: [173, 126]
      wrist: [174, 146]
      hip: [112, 106]
      knee: [112, 146]
      ankle: [76, 146]
      toe: [66, 146]
      farElbow: [178, 126]
      farWrist: [179, 146]
      farKnee: [117, 146]
      farAnkle: [81, 146]
      farToe: [71, 146]
    end:
      head: [196, 96]
      shoulder: [172, 106]
      elbow: [204, 106]
      wrist: [236, 104]
      hip: [112, 106]
      knee: [112, 146]
      ankle: [76, 146]
      toe: [66, 146]
      farElbow: [178, 126]
      farWrist: [179, 146]
      farKnee: [80, 104]
      farAnkle: [44, 102]
      farToe: [36, 106]
  steps:
    - Start on hands and knees, hands under shoulders and knees under hips.
    - Brace your abdomen and keep your back flat, as if a glass of water sat on it.
    - Reach one arm forward and the opposite leg straight back at the same time, and stop at hip height.
    - Hold 2 to 5 seconds, building to 5 seconds, return with control, then switch sides.
  mistakes: arching the lower back, lifting the leg above hip height, rotating the hips.
- id: glute-bridge
  order: 4
  phase: 1
  name: Glute bridge
  dose: 3 sets of 12 reps with a 1-second squeeze at the top
  muscles: Gluteus maximus, hamstrings
  glow:
    - hips
  cycle: 4
  poses:
    start:
      head: [44, 134]
      shoulder: [68, 133]
      elbow: [94, 136]
      wrist: [118, 138]
      hip: [136, 134]
      knee: [168, 104]
      ankle: [190, 134]
      toe: [204, 136]
    end:
      head: [44, 134]
      shoulder: [68, 132]
      elbow: [94, 136]
      wrist: [118, 138]
      hip: [130, 110]
      knee: [170, 98]
      ankle: [190, 134]
      toe: [204, 136]
  steps:
    - Lie on your back with knees bent and feet flat, hip-width apart, with your heels about 25 to 30 centimetres from your hips (a practical starting point, not a sourced figure). If your hamstrings cramp, move your feet closer.
    - Press through your heels and squeeze your glutes to lift your hips.
    - Stop when shoulders, hips and knees form a straight line, without arching your lower back.
    - Hold 1 second and lower slowly.
  mistakes: pushing up with the lower back, feet too far away, hamstring cramping (move your feet closer).
