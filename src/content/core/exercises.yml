# Core guide exercises. Poses are side-on stick-figure joints in SVG-style units (origin top-left, y grows down, the floor
# is y = 150 and x = 150 is the centre). Joint points are [x, y] or [x, y, z], with z in the same units. The figure animates
# start -> end; far-side
# limbs (far*) default to the near side. glow: regions that light up while the exercise works them. cycle: seconds for one rep.
# spineBend: optional [start, end] vertical offset of the spine curve (cat-cow).
- id: mcgill-curl-up
  order: 1
  phase: 1
  name: McGill curl-up
  dose: 3 sets of 8 reps, hold each lift for 7 seconds
  muscles: Rectus abdominis, deep abdominal wall
  glow:
    - torso
  cycle: 4
  poses:
    start:
      head: [192, 130, 0]
      shoulder: [174, 131]
      elbow: [156, 135]
      wrist: [138, 137]
      hip: [130, 132]
      knee: [100, 96]
      ankle: [76, 132]
      toe: [62, 134]
      farElbow: [156, 135]
      farWrist: [138, 137]
      farKnee: [90, 133]
      farAnkle: [50, 135]
      farToe: [42, 132]
    end:
      head: [190, 110, 0]
      shoulder: [172, 120]
      elbow: [156, 135]
      wrist: [138, 137]
      hip: [130, 132]
      knee: [100, 96]
      ankle: [76, 132]
      toe: [62, 134]
      farElbow: [156, 135]
      farWrist: [138, 137]
      farKnee: [90, 133]
      farAnkle: [50, 135]
      farToe: [42, 132]
  steps:
    - Lie on your back, one knee bent and the other leg straight.
    - Place both hands palms down under the curve of your lower back.
    - Brace your abdomen as if bracing for a light punch, then lift only your head and shoulders about 5 cm. Do not bend at the spine.
    - Hold 7 seconds while breathing in small breaths, lower, then swap the bent leg after each set.
  mistakes: pulling the chin to the chest, flattening the back into the hands, sitting all the way up.
- id: side-plank
  order: 2
  phase: 1
  name: Side plank
  dose: "3 sets of 20 seconds per side, adding about 5 seconds a week. At 30 seconds per side you can move from the knees to the full side plank. The time is a progression cue, not a safety limit: the pain rule applies whatever the clock says"
  muscles: Obliques, quadratus lumborum, glute medius
  glow:
    - torso
    - hips
  cycle: 4
  poses:
    start:
      head: [80, 114]
      shoulder: [100, 114]
      elbow: [100, 140]
      wrist: [124, 141]
      hip: [184, 134]
      knee: [228, 138]
      ankle: [266, 141]
      toe: [274, 142]
      farElbow: [130, 100]
      farWrist: [178, 126]
      farKnee: [232, 135]
      farAnkle: [268, 139]
      farToe: [276, 140]
    end:
      head: [82, 104]
      shoulder: [100, 108]
      elbow: [100, 138]
      wrist: [124, 141]
      hip: [184, 121]
      knee: [228, 130]
      ankle: [266, 138]
      toe: [274, 141]
      farElbow: [128, 94]
      farWrist: [176, 112]
      farKnee: [230, 128]
      farAnkle: [268, 135]
      farToe: [276, 138]
  steps:
    - Lie on your side with your elbow directly under your shoulder and knees bent at 90 degrees (the easier version, and the starting point in this guide).
    - Lift your hips until shoulder, hip and knee form one straight line.
    - Keep the top hand on your hip, your ribs stacked and your hips forward, without letting the hips roll back.
    - Keep your shoulder directly above your elbow.
    - Hold, breathing steadily. Lower, then repeat on the other side.
    - Start at 20 seconds per side and add about 5 seconds a week, moving on at 30 seconds. Stop if it hurts, whatever the clock says.
  mistakes: hips sagging, hips rolling backwards, shoulder drifting ahead of the elbow, holding your breath.
- id: bird-dog
  order: 3
  phase: 1
  name: Bird dog
  dose: 3 sets of 8 reps per side, holding each rep 2 to 5 seconds and building to 5 seconds
  muscles: Spinal erectors, multifidus, glutes
  glow:
    - torso
    - hips
  cycle: 5
  poses:
