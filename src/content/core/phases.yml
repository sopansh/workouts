# The three recovery phases of the core guide, in order. `number` links to exercises[].phase.
- id: stabilise
  number: 1
  title: Stabilise
  duration: about 1–2 weeks
  intro: Spine stiffness and glute activation. Do 3 rounds of all six.
  moveOn: Start now
  plan: Phase 1 exercises daily or every other day, plus 20–30 min walking. No swings, jumps or heavy hinging.
- id: load
  number: 2
  title: Load
  moveOn: 0/10 pain at rest and in daily life for about 7 days
  plan: Add goblet squat, then raised kettlebell deadlifts and carries. Keep Phase 1 as a warm-up.
- id: power
  number: 3
  title: Power
  moveOn: Phase 2 loads feel easy and pain-free
  plan: Kettlebell swings, then low-volume squat and broad jumps. Wear shoes while the toe wound heals.
