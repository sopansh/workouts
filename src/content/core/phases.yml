# The three exercise stages of the core guide, in order. `number` links to exercises[].phase.
- id: stabilise
  number: 1
  title: Stabilise
  intro: Core holds and controlled movements. For easier variations and cautions, see the strength and getting-started exercise instructions.
  moveOn: Use the exercise instructions and an appropriate regression; these stages are not recovery milestones.
  plan: Start with a small selection of holds and controlled movements, with rest between sessions. No need to perform every exercise.
- id: load
  number: 2
  title: Load
  moveOn: Controlled movements feel manageable without pain during the session or worsening symptoms afterwards.
  plan: Add goblet squat, then raised kettlebell deadlifts and carries. Keep Phase 1 as a warm-up.
- id: power
  number: 3
  title: Power
  moveOn: Phase 2 loads feel easy and pain-free
  plan: Kettlebell swings, then low-volume squat and broad jumps.
