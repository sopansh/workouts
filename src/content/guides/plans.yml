# Plans for the guide sections: sessions, the week layout and, where sessions are timed, the planning assumptions.
- id: eight-week
  section: getting-started
  name: Eight-week bodyweight plan
  warmup:
    text: "About 5 minutes: march on the spot, circle the arms and hips, then 5 slow sit-to-stands. If anything hurts during the warm-up, do not continue to the working sets."
  sessions:
    - id: A
      title: "Session A: legs, push, pull"
      items:
        - group: squat
          reps: 8-12
        - group: push
          reps: 8-12
        - group: pull
          reps: 8-12
          note: Each side for the backpack row.
        - group: bridge
          reps: 8-12
          note: Each side for the marching and single-leg bridge.
        - group: dead-bug
          reps: 6-10
          note: Each side.
        - group: calf-raise
          reps: 10-15
    - id: B
      title: "Session B: step, hinge, push, pull"
      items:
        - group: step
          reps: 8-12
          note: Each leg.
        - group: hinge
          reps: 8-12
        - group: push
          reps: 8-12
        - group: pull
          reps: 8-12
          note: Each side for the backpack row.
        - group: side-plank
          reps: 10-20 s
          note: Each side. Hold for seconds.
        - group: bird-dog
          reps: 6-8
          note: Each side, 2 to 5 second hold.
  weeks:
    - label: Week 1
      sets: 2
      rir: 3 or more
      days:
        Monday: A
        Thursday: B
      note: Learn the movements. Stay well short of failure. Some muscle soreness in the first week is common.
    - label: Week 2
      sets: 2
      rir: 3 or more
      days:
        Monday: A
        Thursday: B
      note: Same sessions. Add a rep wherever it feels easy and clean.
    - label: Week 3
      sets: 2
      rir: 2 to 3
      days:
        Monday: A
        Wednesday: B
        Friday: A
      note: Three sessions. Keep a rest day between sessions.
    - label: Week 4
      sets: 2
      rir: 2 to 3
      days:
        Monday: B
        Wednesday: A
        Friday: B
      note: The sessions swap round so each gets equal turns.
    - label: Week 5
      sets: 3
      rir: "2"
      days:
        Monday: A
        Wednesday: B
        Friday: A
      note: A third set. Skip it for any exercise that is not clean yet.
    - label: Week 6
      sets: 3
      rir: "2"
      days:
        Monday: B
        Wednesday: A
        Friday: B
      note: Move up a level wherever the move-up rule is met.
    - label: Week 7
      sets: 3
      rir: "2"
      days:
        Monday: A
        Wednesday: B
        Friday: A
      note: The most work of the plan. Hold a level if recovery is poor.
    - label: Week 8
      sets: 2
      rir: "3"
      days:
        Monday: B
        Wednesday: A
        Friday: B
      note: An easier week. Retest each ladder on the progression page at the end.
  timing:
    secondsPerSet: 40
    restSeconds: 60
    secondsBetweenExercises: 45
    warmUpMinutes: 5
    maxMinutes: 45
  status: draft
- id: two-session-week
  section: plyometrics
  name: Two sessions a week, repeated
  warmup:
    text: About 8 minutes. Easy and unhurried.
    items:
      - exercise: march-ankle-circles
      - exercise: squat-to-calf-raise
  sessions:
    - id: A
      title: "Session A: vertical power"
      intro: The main vertical jump, plus the shared ankle, calf and balance work.
      items:
        - exercise: ankle-hop
        - exercise: vertical-jump-stick
        - exercise: standing-calf-raise
        - exercise: bent-knee-calf-raise
        - exercise: single-leg-balance
    - id: B
      title: "Session B: lateral control"
      intro: The cone-marked side-to-side hop, plus the same shared ankle, calf and balance work.
      items:
        - exercise: ankle-hop
        - exercise: lateral-hop
        - exercise: standing-calf-raise
        - exercise: bent-knee-calf-raise
        - exercise: single-leg-balance
  weeks:
    - label: Every week
      days:
        Wednesday: A
        Friday: B
      note: "An example: any two days at least 48 hours apart work. Wednesday and Friday are rest days in the paired strength split."
  status: draft
