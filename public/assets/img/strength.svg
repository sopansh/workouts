<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Loaded barbell">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7fe0"/>
      <stop offset="1" stop-color="#1f3a85"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <circle cx="320" cy="196" r="200" fill="url(#glow)"/>
  <ellipse cx="320" cy="322" rx="240" ry="20" fill="#000" opacity=".28"/>
  <!-- bar -->
  <rect x="64" y="191" width="512" height="18" rx="9" fill="#e9effd"/>
  <rect x="96" y="187" width="10" height="26" rx="3" fill="#aebfe8"/>
  <rect x="534" y="187" width="10" height="26" rx="3" fill="#aebfe8"/>
  <!-- left plates -->
  <rect x="148" y="104" width="28" height="192" rx="9" fill="#fff"/>
  <rect x="182" y="126" width="24" height="148" rx="8" fill="#dbe5fb"/>
  <rect x="212" y="148" width="20" height="104" rx="7" fill="#b9cbf4"/>
  <!-- right plates (mirror) -->
  <rect x="464" y="104" width="28" height="192" rx="9" fill="#fff"/>
  <rect x="434" y="126" width="24" height="148" rx="8" fill="#dbe5fb"/>
  <rect x="408" y="148" width="20" height="104" rx="7" fill="#b9cbf4"/>
  <!-- highlights -->
  <rect x="154" y="116" width="6" height="168" rx="3" fill="#fff" opacity=".6"/>
  <rect x="470" y="116" width="6" height="168" rx="3" fill="#fff" opacity=".6"/>
</svg>
