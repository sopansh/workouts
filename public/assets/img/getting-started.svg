<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Person doing a push-up at home">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fae8e"/>
      <stop offset="1" stop-color="#145a46"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <circle cx="320" cy="210" r="200" fill="url(#glow)"/>
  <ellipse cx="320" cy="318" rx="250" ry="16" fill="#000" opacity=".25"/>
  <!-- floor mat -->
  <rect x="110" y="304" width="420" height="14" rx="7" fill="#fff" opacity=".85"/>
  <!-- push-up, side view -->
  <g fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 236 L440 270"/>
    <path d="M440 270 L500 298"/>
    <path d="M194 242 L204 298"/>
    <path d="M208 244 L222 298"/>
  </g>
  <circle cx="140" cy="226" r="24" fill="#fff"/>
  <!-- working muscles -->
  <path d="M180 238 L198 240" stroke="#ff5a5f" stroke-width="15" stroke-linecap="round" fill="none"/>
</svg>
