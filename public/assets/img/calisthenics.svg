<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Athlete holding an L-sit on parallel bars">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b78dd"/>
      <stop offset="1" stop-color="#46247f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <circle cx="320" cy="190" r="200" fill="url(#glow)"/>
  <ellipse cx="320" cy="338" rx="250" ry="16" fill="#000" opacity=".25"/>
  <!-- parallel bars -->
  <g stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M210 214 H330"/>
    <path d="M222 214 V336"/>
    <path d="M318 214 V336"/>
  </g>
  <!-- L-sit: straight arms down to the bars, upright torso, legs straight forward -->
  <g fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M254 126 L254 206"/>
    <path d="M272 116 L276 186"/>
    <path d="M276 186 L420 186"/>
  </g>
  <circle cx="270" cy="92" r="23" fill="#fff"/>
  <!-- working muscles -->
  <path d="M290 186 L360 186" stroke="#ff5a5f" stroke-width="15" stroke-linecap="round" fill="none"/>
</svg>
